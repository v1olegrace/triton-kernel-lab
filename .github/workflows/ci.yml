name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          version: "0.11.23"

      - name: Install managed Python
        run: uv python install 3.12.13

      - name: Install project
        run: uv sync --extra dev --frozen

      - name: Lint and format
        run: make lint

      - name: Type-check
        run: make type

      - name: Run CPU unit tests with coverage
        run: uv run --frozen pytest -m "not gpu and not interpret" --cov=tklab --cov-report=xml

      - name: Run Triton interpreter tests
        env:
          TRITON_INTERPRET: "1"
        run: uv run --frozen pytest -m interpret --cov=tklab --cov-append --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: coverage.xml
          fail_ci_if_error: false

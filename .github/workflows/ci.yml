name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install managed Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --extra dev

      - name: Lint and format
        run: make lint

      - name: Type-check
        run: make type

      - name: Run CPU unit tests with coverage
        run: uv run pytest -m "not gpu and not interpret" --cov=tklab --cov-report=xml

      - name: Run Triton interpreter tests
        env:
          TRITON_INTERPRET: "1"
        run: uv run pytest -m interpret --cov=tklab --cov-append --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

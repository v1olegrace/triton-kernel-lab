[project]
name = "tklab"
version = "0.1.0"
description = "Production-style Triton kernels with correctness, empirical rooflines, and reproducible benchmarks."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
keywords = ["cuda", "gpu", "pytorch", "triton", "kernels", "benchmarking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "matplotlib>=3.9",
    "torch>=2.10",
    "triton>=3.7,<4",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.0",
    "pytest>=8.2",
    "pytest-cov>=6.0",
    "ruff>=0.13",
]

[project.scripts]
tklab-bench = "tklab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tklab"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "PERF",
    "PTH",
    "RUF",
    "SIM",
    "UP",
]
ignore = ["ANN401", "D105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
pretty = true

[[tool.mypy.overrides]]
module = ["triton.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-config --strict-markers"
markers = [
    "gpu: requires an NVIDIA CUDA GPU",
    "interpret: requires TRITON_INTERPRET=1",
]

[tool.coverage.run]
branch = true
source = ["tklab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
